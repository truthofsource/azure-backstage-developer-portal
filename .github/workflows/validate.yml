name: Validate portal reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s reference/releases -v
      - run: python -B -m unittest discover -s runtime/vm -v
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/demo.py
      - run: python -B runtime/vm/check-compose.py
      - run: for script in runtime/vm/*.sh; do bash -n "$script"; done
