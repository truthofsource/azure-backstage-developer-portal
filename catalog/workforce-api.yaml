{
  "apiVersion": "backstage.io/v1alpha1",
  "kind": "Component",
  "metadata": {
    "name": "workforce-api",
    "title": "Workforce business API",
    "description": "Workforce business API",
    "annotations": {
      "backstage.io/source-location": "url:https://github.com/truthofsource/workforce-platform/tree/main/apps/api",
      "github.com/project-slug": "truthofsource/workforce-platform"
    },
    "links": [
      {
        "url": "https://github.com/truthofsource/workforce-platform/blob/main/docs/runbooks/production-release-and-rollback.md",
        "title": "Release and rollback"
      }
    ]
  },
  "spec": {
